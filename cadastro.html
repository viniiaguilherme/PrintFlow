<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — PrintFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
</head>

<body>

  <main class="auth-page">

    <a href="index.html" class="auth-brand">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M4 17l8-4 8 4-8 4-8-4z" />
          <path d="M4 12l8-4 8 4" />
          <path d="M4 7l8-4 8 4" />
        </svg>
      </span>
      PrintFlow
    </a>

    <div class="auth-card">
      <a href="index.html" class="auth-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>
        Voltar ao início
      </a>

      <h1 class="auth-card__title">Criar conta</h1>
      <p class="auth-card__subtitle">Comece a gerenciar suas impressoras 3D.</p>

      <!-- Formulário de cadastro — agora tratado via Supabase Auth (js/script.js) -->
      <form id="cadastroForm">
        <div class="form-group">
          <label class="form-label" for="cadastroNome">Nome</label>
          <input class="form-input" type="text" id="cadastroNome" name="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cadastroEmail">E-mail</label>
          <input class="form-input" type="email" id="cadastroEmail" name="email" placeholder="voce@oficina.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cadastroSenha">Senha</label>
          <input class="form-input" type="password" id="cadastroSenha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="cadastroConfirmarSenha">Confirmar senha</label>
          <input class="form-input" type="password" id="cadastroConfirmarSenha" name="confirmarSenha"
            placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
      </form>

      <p class="auth-footer-text">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </div>

  </main>

  <!-- Pilha de notificações toast (usada pelo showToast em caso de erro/sucesso no cadastro) -->
  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
