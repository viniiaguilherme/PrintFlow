<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila de Impressão — PrintFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
  <style>
    /* Cards das impressoras (acima da fila geral). Pode ser movido para css/style.css. */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-5);
      margin-bottom: var(--space-6);
    }

    .slot-card .card-printer__head {
      margin-bottom: var(--space-4);
    }

    .slot-empty {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4);
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-md);
      background: var(--color-bg-elevated);
      font-family: var(--font-mono);
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
    }

    .slot-job {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-elevated);
    }

    .slot-job__top {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .slot-job__top .job-row__info {
      flex: 1;
    }

    .slot-job__foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .slot-job__meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    /* Histórico: linhas apagadinhas */
    .job-row--history {
      opacity: .55;
      transition: opacity var(--transition-fast);
    }

    .job-row--history:hover {
      opacity: .85;
    }

    /* Filamentos exibidos nas impressões e no formulário "Nova impressão" */
    .fil-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid var(--color-border-strong);
      flex-shrink: 0;
    }

    .job-row__filaments {
      display: flex;
      flex-wrap: wrap;
      gap: 2px var(--space-3);
      white-space: normal;
    }

    .fil-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .fil-inputs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .fil-inputs__col {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      min-width: 0;
    }

    .fil-inputs__col .form-input {
      padding-inline: .75rem;
    }

    .file-summary {
      margin-bottom: var(--space-5);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-elevated);
      font-size: .875rem;
      color: var(--color-text-secondary);
    }

    .file-summary strong {
      color: var(--color-text-primary);
    }

    .file-summary__row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-3);
      padding-block: 2px;
    }

    .file-summary__fils {
      margin-top: var(--space-2);
      padding-top: var(--space-2);
      border-top: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-summary__fil {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .file-summary__slot {
      font-family: var(--font-mono);
      font-size: .6875rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin-right: var(--space-1);
    }

    /* Lista de escolha de impressora (modal "Enviar para impressora") */
    .pick-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .pick-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      width: 100%;
      padding: .85rem 1rem;
      text-align: left;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-elevated);
      transition: border-color var(--transition-fast), background var(--transition-fast);
    }

    .pick-item:hover:not(:disabled) {
      border-color: var(--color-accent-border);
      background: var(--color-accent-dim);
    }

    .pick-item:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .pick-item__name {
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .pick-item__state {
      font-family: var(--font-mono);
      font-size: .6875rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">

    <!-- Fundo escuro exibido atrás da sidebar quando aberta no mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="sidebar__brand">
        <span class="brand__mark">
          <img src="assets/logo-icon.png" alt="PrintFlow">
        </span>
        PrintFlow
      </a>

      <div class="sidebar__section-label">Controle</div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
          Painel
        </a>
        <a href="fila.html" class="sidebar__link is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
          Fila de Impressão
        </a>
        <a href="impressoras.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="7" rx="1.5"/><path d="M7 9V6a2 2 0 012-2h6a2 2 0 012 2v3"/><path d="M7 16v2a1 1 0 001 1h8a1 1 0 001-1v-2"/></svg>
          Impressoras
        </a>
        <a href="usuarios.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Usuários
        </a>
        <a href="configuracoes.html" class="sidebar__link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Configurações
        </a>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__status">
          <span class="status-dot"></span>
          Sistema online
        </div>
        <div class="sidebar__version">v0.1.0 · PrintFlow</div>
      </div>
    </aside>

    <!-- =====================================================
         ÁREA PRINCIPAL (TOPBAR + CONTEÚDO)
    ====================================================== -->
    <div class="dashboard-content">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar__left">
          <button class="btn-icon topbar__menu-btn" id="menuToggle" aria-label="Abrir menu">
            <i data-lucide="menu"></i>
          </button>

          <a href="espacos.html" class="space-back-btn" id="voltarEspacoBtn">
            <i data-lucide="chevron-left"></i>
            <span class="space-back-btn__label">Espaço</span>
            <span class="space-back-btn__name" id="voltarEspacoNome">Carregando...</span>
          </a>

          <div class="topbar__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input class="form-input" type="text" placeholder="Buscar impressoras, filas, usuários...">
          </div>
        </div>

        <div class="topbar__actions">
          <div class="dropdown">
            <div class="dropdown__menu" id="notifMenu">
              <div class="dropdown__item" style="cursor:default;">Nenhuma notificação nova</div>
            </div>
          </div>

          <div class="dropdown">
            <button class="avatar" id="avatarButton" aria-label="Menu do usuário">--</button>
            <div class="dropdown__menu" id="avatarMenu">
              <a href="perfil.html" class="dropdown__item">
                <i data-lucide="user"></i>
                Perfil
              </a>
              <a href="espacos.html" class="dropdown__item">
                <i data-lucide="layout-grid"></i>
                Meus espaços
              </a>
              <div class="dropdown__divider"></div>
              <button class="dropdown__item" type="button" id="logoutButton">
                <i data-lucide="log-out"></i>
                Sair
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="dashboard-main">
        <div class="dashboard-head">
          <div>
            <span class="eyebrow">// FILA DE IMPRESSÃO</span>
            <h1>A Playlist</h1>
            <p id="queueSummary">Carregando...</p>
          </div>
          <div class="dashboard-head__actions">
            <button type="button" class="btn btn-primary" id="novaImpressaoBtn">
              <i data-lucide="plus"></i>
              Nova impressão
            </button>
          </div>
        </div>

        <!-- Cards das impressoras: cada uma recebe uma impressão por vez.
             Renderizado por js/fila.js. -->
        <div class="slots-grid" id="printerSlots"></div>

        <!-- Barra de ferramentas: apenas a busca (a fila é única) -->
        <div class="queue-toolbar" style="justify-content: flex-end;">
          <div class="queue-toolbar__search">
            <div class="search-field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input class="form-input" type="text" id="queueSearch" placeholder="Buscar modelo ou maker...">
            </div>
          </div>
        </div>

        <!-- Fila geral: impressões que ainda não foram para uma impressora -->
        <div id="queueGroups"></div>

        <!-- Histórico de impressões: concluídas que já saíram da impressora -->
        <div id="queueHistory" style="margin-top: var(--space-6);"></div>

        <p class="text-muted" id="queueEmptyState" style="text-align:center; padding: var(--space-6) 0; display:none;">
          Nenhum trabalho encontrado para essa busca.
        </p>
      </main>
    </div>
  </div>

  <!-- Pilha de notificações toast -->
  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="js/leitor-3mf.js"></script>
  <script src="js/fila.js"></script>
</body>
</html>
