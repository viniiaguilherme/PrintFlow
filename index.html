<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PrintFlow — Gerenciamento de Impressoras 3D</title>
  <meta name="description" content="PrintFlow — O melhor sistema de gerenciamento de impressoras 3D. Monitore, organize filas e controle sua oficina em um só painel.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-landing-mockup">

  <div class="landing-screen">
    <!-- Top Pill Capsule -->
    <header class="landing-header">
      <div class="brand-pill-capsule">
        <span class="brand-pill-capsule__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17l8-4 8 4-8 4-8-4z"/>
            <path d="M4 12l8-4 8 4"/>
            <path d="M4 7l8-4 8 4"/>
          </svg>
        </span>
        <span class="brand-pill-capsule__text">PrintFlow</span>
      </div>
    </header>

    <!-- Welcome Greeting -->
    <div class="landing-greeting">
      Seja  Bem-vindo !
    </div>

    <!-- Main Content: Headline + 3D Printer Visual -->
    <main class="landing-body">
      <div class="landing-headline">
        <h1 class="landing-headline__title">
          O melhor sistema de<br>
          gerenciamento de<br>
          <span class="landing-headline__accent">impressoras<br>3D.</span>
        </h1>
      </div>

      <div class="landing-visual">
        <img src="img/printer.jpg" alt="Impressora 3D PrintFlow" class="landing-printer-img" />
      </div>
    </main>

    <!-- Bottom Action: Entrar + Green Arrow Circle -->
    <footer class="landing-footer">
      <a href="login.html" class="landing-enter-btn" id="enterAppBtn">
        <span class="landing-enter-btn__label">Entrar</span>
        <span class="landing-enter-btn__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </a>
    </footer>
  </div>

  <!-- Supabase JS v2 & Cliente -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/client-supabase.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
