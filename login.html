<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — PrintFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:,">
</head>
<body>

  <main class="auth-page">

    <a href="index.html" class="auth-brand">
      <span class="brand__mark">
        <img src="assets/logo-icon.png" alt="PrintFlow">
      </span>
      PrintFlow
    </a>

    <div class="auth-card">
      <a href="index.html" class="auth-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Voltar ao início
      </a>

      <h1 class="auth-card__title">Entrar</h1>
      <p class="auth-card__subtitle">Acesse seu painel PrintFlow.</p>

      <!-- Formulário de login — agora tratado via Supabase Auth (js/script.js) -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">E-mail</label>
          <input class="form-input" type="email" id="loginEmail" name="email" placeholder="voce@oficina.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginSenha">Senha</label>
          <div class="input-group">
            <input class="form-input" type="password" id="loginSenha" name="senha" placeholder="••••••••" required>
            <button type="button" class="btn-icon" data-toggle-senha="loginSenha" aria-label="Mostrar senha">
              <i data-lucide="eye" class="icone-senha-mostrar"></i><i data-lucide="eye-off" class="icone-senha-ocultar" style="display:none;"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="auth-footer-text">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

  </main>

  <!-- Pilha de notificações toast (usada pelo showToast em caso de erro no login) -->
  <div class="toast-stack" id="toastStack"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/script.js"></script>
</body>
</html>
