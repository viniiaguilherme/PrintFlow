<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Entrar — PrintFlow</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-page">

    <a href="/" class="auth-brand">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17l8-4 8 4-8 4-8-4z"/><path d="M4 12l8-4 8 4"/><path d="M4 7l8-4 8 4"/>
        </svg>
      </span>
      PrintFlow
    </a>

    <div class="auth-card">
      <a href="/" class="auth-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Voltar ao início
      </a>

      <h1 class="auth-card__title">Entrar</h1>
      <p class="auth-card__subtitle">Acesse seu painel PrintFlow e acompanhe suas impressões.</p>

      <!-- Formulário de login -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">E-mail</label>
          <input class="form-input" type="email" id="loginEmail" name="email" placeholder="seu.email@exemplo.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginSenha">Senha</label>
          <input class="form-input" type="password" id="loginSenha" name="senha" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnLoginSubmit">Entrar</button>
      </form>

      <div id="toastStack" class="toast-stack"></div>
    </div>

  </main>

  <!-- Supabase JS v2 & Cliente -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/client-supabase.js"></script>
  <script src="js/client-supabase.js"></script>
  <script src="/js/script.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
